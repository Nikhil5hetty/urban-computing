# Linguistic vocabulary (the CWW "codebook"). Trapezoids are [a, b, c, d]:
# membership rises from 0 at a to 1 at b, stays 1 until c, falls to 0 at d.
# Use null for an open shoulder (-inf / +inf). Final values (UC-020); each breakpoint is
# justified in docs/methods.md §1. Any later change = decision log entry.

summarizers:
  arrival_delay_minutes:          # attribute: actual - planned arrival, minutes
    on_time:       [null, null, 1, 3]   # 3 = SBB punctuality boundary (D-007)
    slightly_late: [1, 3, 3, 5]
    late:          [3, 5, 8, 10]
    very_late:     [8, 10, null, null]

  # Connection slack = (actual departure B - actual arrival A) - min_transfer, minutes.
  connection_slack_minutes:
    missed:      [null, null, -0.5, 0]
    tight:       [-0.5, 0, 1, 2]
    comfortable: [1, 2, null, null]

# Perception-aware "late for me" (SRQ2): a delay is judged against the passenger's own
# transfer margin m (minutes). Membership of "late_for_my_transfer" for delay x:
#   0 if x <= m - spread, 1 if x >= m, linear in between.
perception:
  late_for_my_transfer:
    spread_minutes: 2

# Relative quantifiers on proportions in [0, 1].
quantifiers:
  core:                          # same three words as Pincay et al. 2021
    few:        [null, null, 0.1, 0.35]
    about_half: [0.3, 0.45, 0.55, 0.7]
    most:       [0.5, 0.85, null, null]
  # Pincay et al. (2021), Fig. 2, p. 172; accepted D-028, baseline only.
  pincay2021:
    few:        [null, null, 0.2, 0.4]
    about_half: [0.2, 0.4, 0.6, 0.8]
    most:       [0.6, 0.8, null, null]
  extended:                      # ablation only (UC-054)
    almost_none: [null, null, 0.02, 0.1]
    almost_all:  [0.85, 0.95, null, null]

# Decision words of the assistant (UC-031). Rule is documented in docs/methods.md §5.
decision_words: [safe, at_risk, risky]

# Fuzzy decision words over p_miss, the fuzzy share of the passenger's connections that are
# missed (UC-031, D-029). decision = argmax membership; ties -> the more cautious word.
# Crossovers (mu = 0.5) at p_miss = 0.075 and 0.25 are the crisp baseline's thresholds
# (config/study.yaml crisp_baseline.decision_thresholds, D-026).
decision_sets:
  safe:    [null, null, 0.05, 0.10]
  at_risk: [0.05, 0.10, 0.20, 0.30]
  risky:   [0.20, 0.30, null, null]
