# Auto-dispatch ready tickets to Claude Code and Codex — subscription only, no API keys.
#
# Turn on:  repo variable DISPATCH_ENABLED=true   (Settings → Secrets and variables → Actions)
# Secrets:  DISPATCH_PAT             fine-grained PAT on this repo: Contents RW, Pull requests RW,
#                                    Issues RW. Pushes branches / opens PRs / posts the @codex
#                                    comment as you, so CI runs and Codex accepts the request.
#           CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (Claude Pro/Max subscription)
# Codex:    no secret. Codex cloud (ChatGPT plan) must be connected to this repo with an
#           environment whose setup script runs `uv sync --extra dev` (docs/ORCHESTRATION.md).
# Optional variables: DISPATCH_CAP (3), DISPATCH_CAP_CLAUDE (1), DISPATCH_CAP_CODEX (2)
#
# Humans still review and merge every PR. Merging to main re-runs this workflow, which
# starts whatever just became ready. See docs/ORCHESTRATION.md.
name: dispatch

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # hourly safety net
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan"
        type: boolean
        default: false

concurrency:
  group: dispatch-plan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: vars.DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      claude: ${{ steps.plan.outputs.claude_matrix }}
      codex: ${{ steps.plan.outputs.codex_matrix }}
      has_claude: ${{ steps.plan.outputs.has_claude }}
      has_codex: ${{ steps.plan.outputs.has_codex }}
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_CAP: ${{ vars.DISPATCH_CAP || 3 }}
      DISPATCH_CAP_CLAUDE: ${{ vars.DISPATCH_CAP_CLAUDE || 1 }}
      DISPATCH_CAP_CODEX: ${{ vars.DISPATCH_CAP_CODEX || 2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Reconcile labels
        run: python3 scripts/dispatch.py reconcile
      - name: Plan (and mark picked issues)
        id: plan
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then MARK=""; else MARK="--mark"; fi
          python3 scripts/dispatch.py plan $MARK --output github \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------- Claude Code
  claude:
    needs: plan
    if: needs.plan.outputs.has_claude == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.plan.outputs.claude) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Keep generated uv.lock out of the change (only UC-001 commits it)
        run: |
          if [ "${{ matrix.ticket.id }}" != "UC-001" ] && ! git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock" >> .git/info/exclude
          fi
      - name: Render prompt
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            uv run python scripts/dispatch.py prompt "${{ matrix.ticket.id }}" --agent claude \
              --issue "${{ matrix.ticket.issue }}"
            echo
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }} # for `gh pr create` inside Claude's shell
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.DISPATCH_PAT }}
          # Adjust if your Claude Code version uses a different tool syntax.
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$([ "${{ steps.claude.outcome }}" = "success" ] && echo success || echo failure)
          PR=$(gh pr list -R "${{ github.repository }}" --head "${{ matrix.ticket.branch }}" \
                 --json url --jq '.[0].url' || true)
          if [ "$RESULT" = "success" ] && [ -z "$PR" ]; then RESULT=failure; fi
          uv run python scripts/dispatch.py finish "${{ matrix.ticket.id }}" --agent claude \
            --result "$RESULT" --pr-url "$PR" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------- Codex cloud
  # Opens a draft PR per ticket and asks Codex cloud to implement it via an @codex comment
  # (runs on your ChatGPT plan). Codex pushes to the PR branch; when you mark the PR
  # "Ready for review", the next dispatch run moves the ticket to agent:review.
  codex:
    needs: plan
    if: needs.plan.outputs.has_codex == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.plan.outputs.codex) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Draft PR + @codex request
        id: hand_off
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          ID: ${{ matrix.ticket.id }}
          TITLE: ${{ matrix.ticket.title }}
          BRANCH: ${{ matrix.ticket.branch }}
          ISSUE: ${{ matrix.ticket.issue }}
        run: |
          set -eu
          git config user.name "dispatch"
          git config user.email "dispatch@users.noreply.github.com"
          git checkout -b "$BRANCH"
          python3 scripts/tickets.py set-status "$ID" in-progress
          git commit -am "$ID: start (dispatched to Codex cloud)"
          git push -u origin "$BRANCH"
          printf 'Closes #%s\n\nDispatched to Codex cloud. Codex pushes its work to this branch.\nMark *Ready for review* when it is done.\n' "$ISSUE" > body.md
          PR=$(gh pr create --draft --base main --head "$BRANCH" --title "$ID: $TITLE" --body-file body.md)
          python3 scripts/dispatch.py prompt "$ID" --agent codex --issue "$ISSUE" > prompt.md
          { echo "@codex implement this ticket on this pull request's branch."; echo; cat prompt.md; } > comment.md
          gh pr comment "$PR" --body-file comment.md
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
      - name: Report hand-off failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/dispatch.py finish "${{ matrix.ticket.id }}" --agent codex --result failure \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
