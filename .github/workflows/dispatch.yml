# Auto-dispatch ready tickets to Claude Code and Codex.
#
# Turn on:  repo variable DISPATCH_ENABLED=true   (Settings → Secrets and variables → Actions)
# Secrets:  DISPATCH_PAT             fine-grained PAT on this repo: Contents RW, Pull requests RW,
#                                    Issues RW. Used to push branches / open PRs so CI runs on them
#                                    (events made with GITHUB_TOKEN do not trigger workflows).
#           CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (subscription)  — or —
#           ANTHROPIC_API_KEY        (API billing)
#           OPENAI_API_KEY           for openai/codex-action (API billing)
# Optional variables: DISPATCH_CAP (4), DISPATCH_CAP_CLAUDE (2), DISPATCH_CAP_CODEX (2)
#
# Humans still review and merge every PR. Merging to main re-runs this workflow, which
# starts whatever just became ready. See docs/ORCHESTRATION.md.
name: dispatch

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # hourly safety net
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan"
        type: boolean
        default: false

concurrency:
  group: dispatch-plan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: vars.DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      claude: ${{ steps.plan.outputs.claude_matrix }}
      codex: ${{ steps.plan.outputs.codex_matrix }}
      has_claude: ${{ steps.plan.outputs.has_claude }}
      has_codex: ${{ steps.plan.outputs.has_codex }}
    env:
      GH_TOKEN: ${{ github.token }}
      DISPATCH_CAP: ${{ vars.DISPATCH_CAP || 4 }}
      DISPATCH_CAP_CLAUDE: ${{ vars.DISPATCH_CAP_CLAUDE || 2 }}
      DISPATCH_CAP_CODEX: ${{ vars.DISPATCH_CAP_CODEX || 2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Reconcile labels
        run: python3 scripts/dispatch.py reconcile
      - name: Plan (and mark picked issues)
        id: plan
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then MARK=""; else MARK="--mark"; fi
          python3 scripts/dispatch.py plan $MARK --output github \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------- Claude Code
  claude:
    needs: plan
    if: needs.plan.outputs.has_claude == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.plan.outputs.claude) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Keep generated uv.lock out of the change (only UC-001 commits it)
        run: |
          if [ "${{ matrix.ticket.id }}" != "UC-001" ] && ! git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock" >> .git/info/exclude
          fi
      - name: Render prompt
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            uv run python scripts/dispatch.py prompt "${{ matrix.ticket.id }}" --agent claude \
              --issue "${{ matrix.ticket.issue }}"
            echo
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }} # for `gh pr create` inside Claude's shell
        with:
          prompt: ${{ steps.prompt.outputs.text }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.DISPATCH_PAT }}
          # Adjust if your Claude Code version uses a different tool syntax.
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RESULT=$([ "${{ steps.claude.outcome }}" = "success" ] && echo success || echo failure)
          PR=$(gh pr list -R "${{ github.repository }}" --head "${{ matrix.ticket.branch }}" \
                 --json url --jq '.[0].url' || true)
          if [ "$RESULT" = "success" ] && [ -z "$PR" ]; then RESULT=failure; fi
          uv run python scripts/dispatch.py finish "${{ matrix.ticket.id }}" --agent claude \
            --result "$RESULT" --pr-url "$PR" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------- Codex (2 jobs)
  # Codex runs sandboxed without network or push rights; a second job on a fresh runner
  # applies its patch, re-runs `make check` and opens the PR.
  codex_work:
    needs: plan
    if: needs.plan.outputs.has_codex == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.plan.outputs.codex) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies before the sandbox (no network inside)
        run: uv sync --extra dev
      - name: Keep generated uv.lock out of the change (only UC-001 commits it)
        run: |
          if [ "${{ matrix.ticket.id }}" != "UC-001" ] && ! git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then
            echo "uv.lock" >> .git/info/exclude
          fi
      - name: Render prompt
        run: |
          mkdir -p .dispatch
          uv run python scripts/dispatch.py prompt "${{ matrix.ticket.id }}" --agent codex \
            --issue "${{ matrix.ticket.issue }}" > .dispatch/prompt.md
      - name: Codex
        id: codex
        uses: openai/codex-action@v1
        env:
          UV_OFFLINE: "1"
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .dispatch/prompt.md
          permission-profile: ":workspace"
          output-file: .dispatch/summary.md
      # Only reads git state; the workspace is treated as untrusted output.
      - name: Export patch
        if: always()
        run: |
          git add -A -- . ':!.dispatch'
          git diff --cached --binary > .dispatch/ticket.patch
          wc -c .dispatch/ticket.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-${{ matrix.ticket.id }}
          path: |
            .dispatch/ticket.patch
            .dispatch/summary.md
          if-no-files-found: warn

  codex_pr:
    needs: [plan, codex_work]
    if: always() && needs.plan.outputs.has_codex == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.plan.outputs.codex) }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DISPATCH_PAT }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: codex-${{ matrix.ticket.id }}
          path: .dispatch
      - uses: astral-sh/setup-uv@v3
      - name: Apply, check, open PR
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_PAT }}
          ID: ${{ matrix.ticket.id }}
          TITLE: ${{ matrix.ticket.title }}
          BRANCH: ${{ matrix.ticket.branch }}
          ISSUE: ${{ matrix.ticket.issue }}
        run: |
          set -u
          if [ ! -s .dispatch/ticket.patch ]; then echo "empty patch"; exit 1; fi
          git config user.name "codex-dispatch"
          git config user.email "codex-dispatch@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git apply --index .dispatch/ticket.patch
          uv sync --extra dev
          if make check > .dispatch/check.log 2>&1; then CHECK=pass; else CHECK=fail; fi
          git commit -m "$ID: $TITLE" -m "Implemented by Codex via dispatch workflow."
          git push -u origin "$BRANCH"
          {
            echo "Closes #$ISSUE"
            echo
            echo "**make check:** $CHECK (re-run on a fresh runner)"
            echo
            cat .dispatch/summary.md 2>/dev/null || echo "(no Codex summary)"
            echo
            echo "<details><summary>make check output (tail)</summary>"
            echo
            echo '```'
            tail -n 60 .dispatch/check.log
            echo '```'
            echo "</details>"
          } > .dispatch/body.md
          DRAFT=""; [ "$CHECK" = "fail" ] && DRAFT="--draft"
          gh pr create --title "$ID: $TITLE" --body-file .dispatch/body.md --base main \
            --head "$BRANCH" $DRAFT
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list -R "${{ github.repository }}" --head "${{ matrix.ticket.branch }}" \
                 --json url --jq '.[0].url' || true)
          RESULT=$([ -n "$PR" ] && echo success || echo failure)
          uv run --no-project --with pyyaml python scripts/dispatch.py finish "${{ matrix.ticket.id }}" --agent codex \
            --result "$RESULT" --pr-url "$PR" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
