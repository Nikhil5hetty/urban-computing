[project]
name = "urban-computing"
version = "0.1.0"
description = "Explainable Swiss public-transport assistant with fuzzy linguistic summaries (Computing with Words). Seminar Urban Computing, Human-IST, University of Fribourg, AS-2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "simpful>=2.12",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "matplotlib>=3.9",
    "streamlit>=1.38",
]

[project.optional-dependencies]
# Only needed on UBELIX for UC-040 / UC-043. Never import these at module top level
# outside src/urban_computing/llm/.
llm = [
    "transformers>=4.56",
    "torch>=2.4",
    "accelerate>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urban_computing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realdata: needs files in data/raw (skipped in CI)",
    "gpu: needs a GPU / UBELIX (skipped in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N802", "N806"]  # allow math-style names like Q, S, R in the fuzzy engine
